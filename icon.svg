<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2026"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f3"/>
      <stop offset="1" stop-color="#eef1f3" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- cue line -->
  <path d="M60 128 L60 168 L92 148 Z" fill="#ffc94a"/>
  <line x1="108" y1="148" x2="452" y2="148" stroke="#ffc94a" stroke-width="8" stroke-dasharray="18 12" stroke-linecap="round"/>
  <!-- script lines -->
  <g fill="url(#fade)">
    <rect x="108" y="176" width="300" height="30" rx="15"/>
    <rect x="108" y="226" width="344" height="30" rx="15" opacity=".75"/>
    <rect x="108" y="276" width="232" height="30" rx="15" opacity=".45"/>
  </g>
  <!-- record button -->
  <circle cx="256" cy="398" r="58" fill="none" stroke="#eef1f3" stroke-opacity=".85" stroke-width="10"/>
  <circle cx="256" cy="398" r="40" fill="#ff3b30"/>
</svg>
